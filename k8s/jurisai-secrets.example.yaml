# Copy to jurisai-secrets.yaml, fill in REAL values, then:
#   kubectl apply -f jurisai-secrets.yaml
# Do NOT commit the filled-in version. This secret is created out of band and is
# referenced by the Deployments in jurisai-k8s.yaml (it is NOT in the ArgoCD path).
apiVersion: v1
kind: Secret
metadata:
  name: jurisai-secrets
  namespace: jurisai
type: Opaque
stringData:
  # --- Postgres (must match DATABASE_URL below) ---
  POSTGRES_USER: jurisai
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_DB_PASSWORD
  POSTGRES_DB: jurisai

  # --- App / server ---
  NODE_ENV: production
  DATABASE_URL: postgresql://jurisai:CHANGE_ME_STRONG_DB_PASSWORD@jurisai-postgres:5432/jurisai?schema=public
  JWT_SECRET: CHANGE_ME_LONG_RANDOM_64_CHARS
  JWT_EXPIRES_IN: 7d
  COOKIE_NAME: jurisai_session
  CLIENT_URL: https://jurisai.rit.services

  # --- Email (SMTP). Leave SMTP_HOST blank to disable real sending. ---
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASS: ""
  EMAIL_FROM: JurisAI <no-reply@rit.services>

  # --- Screenshot-feedback plugin recipients ---
  FEEDBACK_RECIPIENTS: rit.services.backend@gmail.com

  # Set to "true" only if you intentionally want the demo/admin seed accounts.
  SEED_DEMO: "false"
