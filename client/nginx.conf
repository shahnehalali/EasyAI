# Serves the JurisAI SPA. /api and /uploads are routed to the API by the
# Traefik IngressRoute (they never reach nginx), so we only serve static files
# and fall back to index.html for client-side routing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
