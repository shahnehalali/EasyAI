# Serves the JurisAI SPA. /api and /uploads are routed to the API by the
# Traefik IngressRoute (they never reach nginx), so we only serve static files
# and fall back to index.html for client-side routing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets. Their filenames change on every build, so they can
  # be cached forever.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html names those hashed bundles, so it must be revalidated on every
  # load. Without an explicit Cache-Control, browsers apply heuristic caching and
  # keep serving the previous index.html after a deploy, which points at the old
  # bundles: the user never sees the new build. ETag/Last-Modified keep the
  # revalidation a cheap 304.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # $uri.html catches the prerendered marketing pages (welcome.html,
  # about.html, ...), written by client/scripts/prerender.mjs as flat files
  # rather than <route>/index.html on purpose: a directory match makes nginx
  # issue a 301 to add the trailing slash before it ever reaches try_files,
  # which most non-JS crawlers either do not follow or follow to a URL that
  # no longer matches the page's own <link rel="canonical">. A flat file is
  # served directly, no redirect, no extra hop.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
}
