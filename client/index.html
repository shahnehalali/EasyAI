<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Versioned query string: browsers cache favicons far more stubbornly
         than normal <img> requests (often ignoring a hard refresh), so a
         plain re-upload of the same /trial.png is not enough to make an
         already-visited browser pick up the new teal artwork. Bump this
         version whenever the favicon image itself changes again. -->
    <link rel="icon" type="image/png" href="/trial.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compliance Check - Germany</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
